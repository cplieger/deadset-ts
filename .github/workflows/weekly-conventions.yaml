name: Weekly conventions

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "starters/**"
      - "src/convention-rows.ts"
      - "src/conventions.ts"

permissions:
  contents: read

concurrency:
  group: weekly-conventions-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pinned:
    name: Starters at the pinned versions
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Run the starter test
        env:
          DEADSET_STARTERS: pinned
        run: npm run test:starters

  latest:
    name: Starters at each row's latest release
    # A new upstream release fails this whatever a pull request changed, so it runs unwatched only.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Run the starter test
        env:
          DEADSET_STARTERS: latest
        run: npm run test:starters

  oracle:
    name: Serialized members against the runtime at a larger count
    # A new counterexample is a bug report, so this runs unwatched only.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Run the runtime oracle
        env:
          DEADSET_ORACLE_RUNS: "2000"
          DEADSET_ORACLE_SEED: ${{ github.run_number }}
        run: npx vitest --run src/exemptions/serialization-contract.property.test.ts -t "a member serialized when the program runs"

  notify:
    needs: [pinned, latest, oracle]
    if: always()
    permissions:
      actions: read
      contents: read
      issues: write
    uses: cplieger/ci/.github/workflows/notify-failure.yaml@a224677a013f1dadf79419bf4d8b9bf2757bb7e6 # v3.45.14
    with:
      workflow: ${{ github.workflow }}
      run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
